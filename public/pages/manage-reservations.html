<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservations | PAALHU staff</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/manage-reservations.js"></script>
</head>
<body>
    <header>
        <h1>Reservations</h1>
        <nav aria-label="Staff navigation">
            <ul>
                <li><a href="manage.html">Staff home</a></li>
                <li><a href="manage-dishes.html">Dishes</a></li>
                <li><a href="manage-reservations.html" aria-current="page">Reservations</a></li>
                <li><a href="manage-orders.html">Orders</a></li>
                <li><a href="manage-set-menus.html">Set menus</a></li>
                <li><a href="manage-drinks.html">Drinks</a></li>
                <li><a href="index.html">Back to the website</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2 id="form-title">New reservation</h2>
            <!-- novalidate: the browser bubbles are off; forms.js shows each message under its field instead. -->
            <form id="item-form" class="item-form" novalidate>
                <div class="field">
                    <label for="f-name">Name</label>
                    <input id="f-name" name="name" required minlength="3" maxlength="50" autocomplete="off"
                           data-message="Name is required and must have 3 to 50 characters.">
                    <span class="error" data-for="name"></span>
                </div>
                <div class="field">
                    <label for="f-phone">Phone</label>
                    <input id="f-phone" name="phone" type="tel" required pattern="(\+34|0034)?[\s.\-\(\)]*(\d[\s.\-\(\)]*){9}"
                           data-message="Phone must have 9 digits.">
                    <span class="error" data-for="phone"></span>
                </div>
                <div class="field">
                    <label for="f-date">Date</label>
                    <input id="f-date" name="date" type="date" required
                           data-message="Date must be a real date written as YYYY-MM-DD.">
                    <span class="error" data-for="date"></span>
                </div>
                <div class="field">
                    <label for="f-time">Time</label>
                    <input id="f-time" name="time" type="time" required
                           data-message="Time must be written as HH:MM (24 h).">
                    <span class="error" data-for="time"></span>
                </div>
                <div class="field">
                    <label for="f-guests">Guests</label>
                    <input id="f-guests" name="guests" type="number" required min="1" max="12" step="1"
                           data-message="Guests must be a whole number from 1 to 12.">
                    <span class="error" data-for="guests"></span>
                </div>
                <div class="field">
                    <label for="f-status">Status</label>
                    <!-- Same list as RESERVATION_STATUSES in src/validators/reservationsValidator.js -->
                    <select id="f-status" name="status" required
                            data-message="Status must be one of: confirmed, seated, cancelled, no-show.">
                        <option value="confirmed">confirmed</option>
                        <option value="seated">seated</option>
                        <option value="cancelled">cancelled</option>
                        <option value="no-show">no-show</option>
                    </select>
                    <span class="error" data-for="status"></span>
                </div>
                <div class="field wide">
                    <label for="f-notes">Notes <small>(optional)</small></label>
                    <textarea id="f-notes" name="notes" rows="2" maxlength="500"
                              data-message="Notes must be text of at most 500 characters."></textarea>
                    <span class="error" data-for="notes"></span>
                </div>
                <div class="form-actions">
                    <button type="submit">Add reservation</button>
                    <button type="button" class="cancel-edit secondary" hidden>Cancel editing</button>
                </div>
                <p class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
        <section>
            <h2>All reservations</h2>
            <p id="list-status" class="status loading" role="status" aria-live="polite">Loading…</p>
            <div id="list" class="table-wrap"></div>
        </section>
    </main>
</body>
</html>
