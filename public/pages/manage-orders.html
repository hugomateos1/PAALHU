<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orders | PAALHU staff</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/manage-orders.js"></script>
</head>
<body>
    <header>
        <h1>Orders</h1>
        <nav aria-label="Staff navigation">
            <ul>
                <li><a href="manage.html">Staff home</a></li>
                <li><a href="manage-dishes.html">Dishes</a></li>
                <li><a href="manage-reservations.html">Reservations</a></li>
                <li><a href="manage-orders.html" aria-current="page">Orders</a></li>
                <li><a href="manage-set-menus.html">Set menus</a></li>
                <li><a href="manage-drinks.html">Drinks</a></li>
                <li><a href="index.html">Back to the website</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2 id="form-title">New order</h2>
            <form id="item-form" class="item-form" novalidate>
                <div class="field">
                    <label for="f-name">Name</label>
                    <input id="f-name" name="name" required minlength="3" maxlength="50" autocomplete="off"
                           data-message="Name is required and must have 3 to 50 characters.">
                    <span class="error" data-for="name"></span>
                </div>
                <div class="field">
                    <label for="f-phone">Phone</label>
                    <input id="f-phone" name="phone" type="tel" required pattern="(\+34|0034)?[\s.\-\(\)]*(\d[\s.\-\(\)]*){9}"
                           data-message="Phone must have 9 digits.">
                    <span class="error" data-for="phone"></span>
                </div>
                <div class="field">
                    <label for="f-type">Type</label>
                    <!-- Same list as ORDER_TYPES in src/validators/ordersValidator.js -->
                    <select id="f-type" name="type" required
                            data-message="Type must be one of: takeaway, delivery.">
                        <option value="takeaway">takeaway</option>
                        <option value="delivery">delivery</option>
                    </select>
                    <span class="error" data-for="type"></span>
                </div>
                <div class="field">
                    <label for="f-total">Total (&euro;)</label>
                    <input id="f-total" name="total" type="number" required min="0.5" max="500" step="0.01"
                           data-message="Total must be a number from 0.50 to 500.00.">
                    <span class="error" data-for="total"></span>
                </div>
                <div class="field">
                    <label for="f-status">Status</label>
                    <!-- Same list as ORDER_STATUSES in src/validators/ordersValidator.js -->
                    <select id="f-status" name="status" required
                            data-message="Status must be one of: received, confirmed, ready, delivered, cancelled.">
                        <option value="received">received</option>
                        <option value="confirmed">confirmed</option>
                        <option value="ready">ready</option>
                        <option value="delivered">delivered</option>
                        <option value="cancelled">cancelled</option>
                    </select>
                    <span class="error" data-for="status"></span>
                </div>
                <div class="field wide">
                    <label for="f-address">Address <small>(only for delivery)</small></label>
                    <input id="f-address" name="address" maxlength="200"
                           data-message="A delivery order needs an address (at most 200 characters).">
                    <span class="error" data-for="address"></span>
                </div>
                <div class="form-actions">
                    <button type="submit">Add order</button>
                    <button type="button" class="cancel-edit secondary" hidden>Cancel editing</button>
                </div>
                <p class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
        <section>
            <h2>All orders</h2>
            <p id="list-status" class="status loading" role="status" aria-live="polite">Loading…</p>
            <div id="list" class="table-wrap"></div>
        </section>
    </main>
</body>
</html>
