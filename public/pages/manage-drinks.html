<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drinks | PAALHU staff</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/manage-drinks.js"></script>
</head>
<body>
    <header>
        <h1>Drinks</h1>
        <nav aria-label="Staff navigation">
            <ul>
                <li><a href="manage.html">Staff home</a></li>
                <li><a href="manage-dishes.html">Dishes</a></li>
                <li><a href="manage-reservations.html">Reservations</a></li>
                <li><a href="manage-orders.html">Orders</a></li>
                <li><a href="manage-set-menus.html">Set menus</a></li>
                <li><a href="manage-drinks.html" aria-current="page">Drinks</a></li>
                <li><a href="index.html">Back to the website</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2 id="form-title">New drink</h2>
            <form id="item-form" class="item-form" novalidate>
                <div class="field">
                    <label for="f-name">Name</label>
                    <input id="f-name" name="name" required minlength="2" maxlength="60" autocomplete="off"
                           data-message="Name is required and must have 2 to 60 characters.">
                    <span class="error" data-for="name"></span>
                </div>
                <div class="field">
                    <label for="f-type">Type</label>
                    <!-- Same list as DRINK_TYPES in src/validators/drinksValidator.js -->
                    <select id="f-type" name="type" required
                            data-message="Type must be one of: lassi, tea, soft-drink, beer, water.">
                        <option value="lassi">lassi</option>
                        <option value="tea">tea</option>
                        <option value="soft-drink">soft-drink</option>
                        <option value="beer">beer</option>
                        <option value="water">water</option>
                    </select>
                    <span class="error" data-for="type"></span>
                </div>
                <div class="field">
                    <label for="f-price">Price (&euro;)</label>
                    <input id="f-price" name="price" type="number" required min="0.5" max="20" step="0.01"
                           data-message="Price must be a number from 0.50 to 20.00.">
                    <span class="error" data-for="price"></span>
                </div>
                <div class="field check">
                    <input id="f-alcoholic" name="alcoholic" type="checkbox">
                    <label for="f-alcoholic">Alcoholic</label>
                    <span class="error" data-for="alcoholic"></span>
                </div>
                <div class="form-actions">
                    <button type="submit">Add drink</button>
                    <button type="button" class="cancel-edit secondary" hidden>Cancel editing</button>
                </div>
                <p class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
        <section>
            <h2>All drinks</h2>
            <p id="list-status" class="status loading" role="status" aria-live="polite">Loading…</p>
            <div id="list" class="table-wrap"></div>
        </section>
    </main>
</body>
</html>
