<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set menus | PAALHU staff</title>
    <meta name="robots" content="noindex">
    <link rel="stylesheet" href="../css/styles.css">
    <script type="module" src="../js/manage-set-menus.js"></script>
</head>
<body>
    <header>
        <h1>Set menus</h1>
        <nav aria-label="Staff navigation">
            <ul>
                <li><a href="manage.html">Staff home</a></li>
                <li><a href="manage-reservations.html">Reservations</a></li>
                <li><a href="manage-orders.html">Orders</a></li>
                <li><a href="manage-set-menus.html" aria-current="page">Set menus</a></li>
                <li><a href="manage-drinks.html">Drinks</a></li>
                <li><a href="index.html">Back to the website</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <h2 id="form-title">New set menu</h2>
            <form id="item-form" class="item-form" novalidate>
                <div class="field">
                    <label for="f-name">Name</label>
                    <input id="f-name" name="name" required minlength="2" maxlength="60" autocomplete="off"
                           data-message="Name is required and must have 2 to 60 characters.">
                    <span class="error" data-for="name"></span>
                </div>
                <div class="field">
                    <label for="f-price">Price (&euro;)</label>
                    <input id="f-price" name="price" type="number" required min="5" max="60" step="0.01"
                           data-message="Price must be a number from 5.00 to 60.00.">
                    <span class="error" data-for="price"></span>
                </div>
                <div class="field">
                    <label for="f-service">Service</label>
                    <!-- Same list as SERVICES in src/validators/setMenusValidator.js -->
                    <select id="f-service" name="service" required
                            data-message="Service must be one of: lunch, dinner.">
                        <option value="lunch">lunch</option>
                        <option value="dinner">dinner</option>
                    </select>
                    <span class="error" data-for="service"></span>
                </div>
                <div class="field check">
                    <input id="f-weekdays" name="weekdaysOnly" type="checkbox">
                    <label for="f-weekdays">Weekdays only (Monday to Friday)</label>
                    <span class="error" data-for="weekdaysOnly"></span>
                </div>
                <div class="field check">
                    <input id="f-active" name="active" type="checkbox" checked>
                    <label for="f-active">Active (offered now)</label>
                    <span class="error" data-for="active"></span>
                </div>
                <div class="form-actions">
                    <button type="submit">Add set menu</button>
                    <button type="button" class="cancel-edit secondary" hidden>Cancel editing</button>
                </div>
                <p class="form-message" role="status" aria-live="polite"></p>
            </form>
        </section>
        <section>
            <h2>All set menus</h2>
            <p id="list-status" class="status loading" role="status" aria-live="polite">Loading…</p>
            <div id="list" class="table-wrap"></div>
        </section>
    </main>
</body>
</html>
